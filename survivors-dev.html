<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hero Survivors (dev)</title>
<!-- Hero Survivors DEV PROTOTYPE (Claude, 24 Oct 2026). Placeholder shapes only - ChatGPT's aura art replaces them.
     Drives server/survivors-core.js exactly as the game will: joystick = move AND aim, ULT button, level-up picks. -->
<style>
  :root { --bg:#120d0a; --panel:#1e1612; --ink:#f4e7d4; --dim:#a8937a; --ember:#ff7a2a; --gold:#f2c14e; --hp:#e2433a; --xp:#5fb8ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.3 system-ui,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:0; right:0; top:env(safe-area-inset-top,0); padding:8px 12px; display:flex; gap:12px; align-items:center; pointer-events:none; }
  #hud .bar { flex:1; height:8px; background:#0006; border-radius:4px; overflow:hidden; } #hud .bar i { display:block; height:100%; }
  #xp i { background:var(--xp); } #hp i { background:var(--hp); }
  #time { font-weight:700; font-variant-numeric:tabular-nums; min-width:56px; text-align:center; }
  #lvl,#kills { font-variant-numeric:tabular-nums; color:var(--dim); }
  #ult { position:fixed; right:22px; bottom:calc(22px + env(safe-area-inset-bottom,0)); width:84px; height:84px; border-radius:50%;
         border:3px solid var(--gold); background:radial-gradient(#3a2414,#1a100a); color:var(--gold); font-weight:800; font-size:16px; }
  #ult.ready { box-shadow:0 0 22px var(--ember); background:radial-gradient(#ff8a3a,#7a2a10); color:#fff; }
  /* the hero's own skills: buttons in an arc round the ULT, bottom right (Phil 24 Oct) */
  .sk { position:fixed; width:62px; height:62px; border-radius:50%; border:2px solid var(--gold); color:var(--ink); font-size:11px; font-weight:700; line-height:1.05;
        background:conic-gradient(#000b calc(var(--cd,0) * 1turn), #3a2414 0); padding:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .sk.cool { border-color:#ffffff33; color:var(--dim); } .sk small { font-size:13px; font-variant-numeric:tabular-nums; color:#fff; }
  .sk .k { position:absolute; top:-6px; right:-4px; font-size:10px; background:var(--panel); border-radius:6px; padding:1px 4px; color:var(--dim); }
  #stick { position:fixed; left:30px; bottom:calc(30px + env(safe-area-inset-bottom,0)); width:120px; height:120px; border-radius:50%; background:#ffffff10; border:2px solid #ffffff22; }
  #knob { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:#ffffff40; }
  #pick { position:fixed; inset:0; display:none; background:#000a; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:16px; }
  #pick h2 { margin:0 0 6px; color:var(--gold); }
  #pick button { width:min(420px,92vw); padding:14px; border-radius:10px; border:2px solid #ffffff22; background:var(--panel); color:var(--ink); text-align:left; font-size:15px; }
  #pick button b { color:var(--gold); } #pick button small { display:block; color:var(--dim); margin-top:3px; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:var(--bg); padding:16px; }
  #start select,#start button { font-size:16px; padding:10px 14px; border-radius:8px; background:var(--panel); color:var(--ink); border:1px solid #ffffff33; }
  #start button { background:var(--ember); color:#1a0d05; font-weight:800; border:0; }
  /* the game is landscape (Phil 24 Oct): on a short landscape phone the controls shrink so the skill arc fits under the HUD */
  @media (orientation:landscape) and (max-height:500px) {
    #ult { width:72px; height:72px; right:calc(18px + env(safe-area-inset-right,0px)); bottom:14px; font-size:14px; }
    .sk { width:54px; height:54px; font-size:10px; }
    #stick { left:calc(24px + env(safe-area-inset-left,0px)); bottom:16px; width:104px; height:104px; } #knob { left:32px; top:32px; }
    #hud { padding:6px calc(12px + env(safe-area-inset-right,0px)) 6px calc(12px + env(safe-area-inset-left,0px)); }
  }
  #end { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; background:#000c; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="cv3" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none"></canvas>
<div id="hud"><span id="time">0:00</span><div class="bar" id="hp"><i></i></div><div class="bar" id="xp"><i></i></div><span id="lvl">Lv 1</span><span id="kills">0</span></div>
<div id="stick"><div id="knob"></div></div>
<button id="ult">ULT</button>
<div id="skills"></div>
<div id="pick"><h2>LEVEL UP</h2></div>
<div id="end"><h2 id="endT"></h2><div id="endS"></div><button onclick="location.reload()">Again</button></div>
<div id="start">
  <h1 style="color:var(--gold);margin:0">HERO SURVIVORS</h1><div style="color:var(--dim)">Story · Stage 1 · Emberfall Vale</div>
  <label>Class <select id="cls"><option>Tank</option><option>Bruiser</option><option>Mage</option><option>Support</option><option>Assassin</option><option>Marksman</option></select></label>
  <label>Mode <select id="mode"><option value="story">Story (30:00, then the boss)</option><option value="survive">Survive (endless)</option></select></label>
  <label>Stage <select id="stage"></select></label>
  <label><input type="checkbox" id="use3d" checked> 3D hero pilot: Linnet (Meshy, 1K textures)</label>
  <button id="go">PLAY</button>
  <div id="mem" style="color:var(--dim)"></div>
  <div style="color:var(--dim);max-width:340px;text-align:center">Move with the joystick or WASD. You aim the way you move. Auras fire on their own; your skills are the buttons (or 1-5). ULT (or Space) when the ring is full.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/assets/js/three-r128-GLTFLoader.js"></script>
<script src="/server/survivors-core.js?v=dev6"></script>
<script>
(async function () {
  const C = window.SurvivorsCore, AURAS = await (await fetch('/server/survivors-auras.json?v=dev1')).json();
  const byKey = {}; AURAS.forEach(a => byKey[a.key] = a);
  const st = document.getElementById('stage'); for (let i = 1; i <= C.STAGES; i++) st.add(new Option('Stage ' + i, i));
  const cv = document.getElementById('cv'), g = cv.getContext('2d');
  let S = null, input = { mx: 0, my: 0 }, ultReq = false, skillReq = null, pickReq = null, acc = 0, last = 0;
  /* hero kits: the hero's OWN skills as buttons. Linnet = her real kit (Mending Stitch heals, Reinforced Seam = can't drop below
     1 HP; Golden Thread is her passive). Numbers are first-pass dev values. anim = the Meshy cast clip on her 3D model. */
  const KITS = {
    linnet: [{ key: 'mending_stitch', name: 'Mending Stitch', kind: 'heal', cd: 12, power: 0.3, anim: 'mage_soell_cast' },
             { key: 'reinforced_seam', name: 'Reinforced Seam', kind: 'ward', cd: 20, dur: 4, anim: 'Charged_Spell_Cast' }],
    Tank: [{ key: 't_ward', name: 'Bulwark', kind: 'ward', cd: 18, dur: 3 }, { key: 't_nova', name: 'Slam', kind: 'nova', cd: 7, power: 2.5 }],
    Bruiser: [{ key: 'b_dash', name: 'Charge', kind: 'dash', cd: 6, power: 4 }, { key: 'b_nova', name: 'Cleave', kind: 'nova', cd: 6, power: 3 }],
    Mage: [{ key: 'm_bolt', name: 'Bolt', kind: 'bolt', cd: 4, power: 4 }, { key: 'm_nova', name: 'Flare', kind: 'nova', cd: 9, power: 4 }],
    Support: [{ key: 's_heal', name: 'Mend', kind: 'heal', cd: 12, power: 0.3 }, { key: 's_ward', name: 'Aegis', kind: 'ward', cd: 20, dur: 4 }],
    Assassin: [{ key: 'a_dash', name: 'Blink', kind: 'dash', cd: 4, power: 5 }, { key: 'a_bolt', name: 'Knives', kind: 'bolt', cd: 3, power: 3 }],
    Marksman: [{ key: 'k_bolt', name: 'Pierce', kind: 'bolt', cd: 3, power: 4 }, { key: 'k_dash', name: 'Roll', kind: 'dash', cd: 7, power: 3.5 }],
  };
  const SKPOS_TALL = [[118, 26], [104, 104], [30, 118], [190, 22], [176, 98]];   // [right, bottom] px: an arc round the ULT
  const SKPOS_SHORT = [[100, 12], [88, 78], [24, 96], [164, 10], [152, 72]];     // the same arc, for a short landscape phone
  const short = () => innerHeight <= 500 && innerWidth > innerHeight;
  let SKPOS = short() ? SKPOS_SHORT : SKPOS_TALL;
  addEventListener('resize', () => { const n = short() ? SKPOS_SHORT : SKPOS_TALL; if (n !== SKPOS) { SKPOS = n; if (KIT.length) buildSkillButtons(); } });
  let KIT = [];
  function buildSkillButtons() {
    const box = document.getElementById('skills'); box.innerHTML = '';
    KIT.forEach((k, i) => { const b = document.createElement('button'); b.className = 'sk'; b.id = 'sk' + i;
      b.style.right = SKPOS[i][0] + 'px'; b.style.bottom = 'calc(' + SKPOS[i][1] + 'px + env(safe-area-inset-bottom,0px))';
      b.innerHTML = '<span class="k">' + (i + 1) + '</span><span>' + k.name.replace(' ', '<br>') + '</span><small></small>';
      b.addEventListener('pointerdown', e => { e.preventDefault(); skillReq = i; }); box.appendChild(b); });
  }
  function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();
  // keyboard
  const keys = {}; addEventListener('keydown', e => { keys[e.key.toLowerCase()] = 1; if (e.code === 'Space') ultReq = true; const n = +e.key; if (n >= 1 && n <= KIT.length) skillReq = n - 1; }); addEventListener('keyup', e => keys[e.key.toLowerCase()] = 0);
  // touch joystick
  const stick = document.getElementById('stick'), knob = document.getElementById('knob'); let sid = null, scx = 0, scy = 0, smx = 0, smy = 0;
  stick.addEventListener('pointerdown', e => { sid = e.pointerId; const r = stick.getBoundingClientRect(); scx = r.left + r.width / 2; scy = r.top + r.height / 2; stick.setPointerCapture(sid); move(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) move(e); });
  stick.addEventListener('pointerup', () => { sid = null; smx = smy = 0; knob.style.transform = ''; });
  function move(e) { let dx = e.clientX - scx, dy = e.clientY - scy; const d = Math.hypot(dx, dy), m = 50; if (d > m) { dx *= m / d; dy *= m / d; } smx = dx / m; smy = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`; }
  document.getElementById('ult').onclick = () => ultReq = true;
  /* LINNET 3D PILOT (Phil 24 Oct: "set up the threadseer pilot"). One rigged Meshy model, 1024 px textures (92 MB -> 5 MB).
     The camera looks down at the field; the model turns to face the way the hero moves and always walks (Phil 24 Oct: "her run, turn it into a walk"); standing still holds the walk's first frame. */
  let H3 = null;
  async function load3d() {
    const cv3 = document.getElementById('cv3'), r = new THREE.WebGLRenderer({ canvas: cv3, alpha: true, antialias: true });
    r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight, false); r.outputEncoding = THREE.sRGBEncoding;
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
    cam.position.set(0, 9, 7); cam.lookAt(0, 0.6, 0);
    scene.add(new THREE.HemisphereLight(0xfff2e0, 0x504030, 1.7)); const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(2, 8, 6); scene.add(dl); scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const gltf = await new Promise((ok, no) => new THREE.GLTFLoader().load('/assets/survivors/linnet-1k.glb', ok, undefined, no));
    const model = gltf.scene, box = new THREE.Box3().setFromObject(model), h = box.max.y - box.min.y;
    model.scale.setScalar(HERO_M / h); scene.add(model);
    const mixer = new THREE.AnimationMixer(model), clips = {}; gltf.animations.forEach(c => clips[c.name] = mixer.clipAction(c));
    let cur = null, casting = false; function play(n) { if (casting || !clips[n] || cur === n) return; if (cur) clips[cur].fadeOut(0.15); clips[n].reset().fadeIn(0.15).play(); cur = n; }
    // a skill press plays its cast clip once (sped to fit ~1.2 s so she keeps up with the fight), then she walks again
    function cast(n) { const a = clips[n]; if (!a) return; if (cur && cur !== n) clips[cur].fadeOut(0.1); a.reset(); a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = false;
      a.timeScale = Math.max(1, a.getClip().duration / 1.2); a.fadeIn(0.1).play(); cur = n; casting = true; }
    mixer.addEventListener('finished', e => { if (e.action === clips[cur]) { casting = false; cur = null; play('Walking'); } });
    play('Walking');
    addEventListener('resize', () => { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
    const info = r.info; H3 = { r, scene, cam, model, mixer, play, cast, clips, isCasting: () => casting, clock: new THREE.Clock(), info, names: Object.keys(clips) };
    document.getElementById('mem').textContent = '3D loaded: ' + H3.names.join(', ');
  }
  document.getElementById('go').onclick = () => {
    const cls = document.getElementById('use3d').checked ? 'Support' : document.getElementById('cls').value;   // Linnet is a Support
    KIT = document.getElementById('use3d').checked ? KITS.linnet : KITS[cls]; buildSkillButtons();
    S = C.create({ key: 'dev', cls, maxHp: 3000, atk: 260, armor: 300, crit: 0.1, critDmg: 0.6, skills: KIT },
                 { mode: document.getElementById('mode').value, stage: +st.value, seed: (Math.random() * 4e9) >>> 0, auras: AURAS });
    document.getElementById('start').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame);
    if (document.getElementById('use3d').checked) load3d().catch(e => console.error('3D load failed', e));
  };
  function label(o) {
    if (o.t === 'aura') { const a = byKey[o.key]; return `<b>${a.name}</b> ${o.to === 1 ? 'NEW' : 'Lv ' + o.to}${o.to === 10 ? ' - ' + a.l10 : ''}<small>${a.fam} aura · ${a.fx}</small>`; }
    if (o.t === 'passive') { const p = C.PASSIVES[o.key]; return `<b>${p.name}</b> ${o.to === 1 ? 'NEW' : 'Lv ' + o.to}<small>${p.what}</small>`; }
    return '<b>Heal</b><small>restore all health</small>';
  }
  function showPick() {
    const box = document.getElementById('pick'); box.querySelectorAll('button').forEach(b => b.remove());
    S.choice.forEach((o, i) => { const b = document.createElement('button'); b.innerHTML = label(o); b.onclick = () => { pickReq = i; box.style.display = 'none'; }; box.appendChild(b); });
    box.style.display = 'flex';
  }
  function frame(now) {
    if (!S) return;
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    let kx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), ky = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    input.mx = sid != null ? smx : kx; input.my = sid != null ? smy : ky;
    while (acc >= C.TICK && !S.ended) {
      acc -= C.TICK;
      if (S.choice) { if (pickReq == null) { if (document.getElementById('pick').style.display !== 'flex') showPick(); acc = 0; break; } C.step(S, { mx: input.mx, my: input.my, pick: pickReq }); pickReq = null; continue; }
      C.step(S, { mx: input.mx, my: input.my, ult: ultReq, skill: skillReq == null ? undefined : skillReq }); ultReq = false; skillReq = null;
    }
    draw();
    if (S.ended) { const e = document.getElementById('end'); e.style.display = 'flex'; document.getElementById('endT').textContent = S.won ? 'STAGE CLEARED' : (S.mode === 'survive' ? 'SURVIVED' : 'FALLEN');
      document.getElementById('endS').textContent = `${fmt(S.t)} · ${S.kills} kills · level ${S.hero.level} · ${S.inputs.length} inputs recorded`; return; }
    requestAnimationFrame(frame);
  }
  function fmt(t) { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
  let seenFx = 0;
  /* OUR MONSTERS (Story Stage 1 = Emberfall Vale, the campaign's Chapter 1 cast). Each walk sheet is the game's own (6 x 2, 12
     frames, art faces RIGHT - the game's flip:false), copied into a small canvas on load (frame height ~110 px) so the phone
     holds ~10 small sheets, not 10 full ones. Sheet numbers = the game's ANIM table. hM = drawn height in metres by role. */
  const SKIN = {
    'ooznik': { f: 'ooznik_walk_hd', fw: 300, fh: 242 }, 'skulk': { f: 'skulk_walk_hd', fw: 251, fh: 300 },
    'cinder skulk': { f: 'cinderskulk_walk_hd', fw: 300, fh: 248 }, 'sootwing imp': { f: 'sootwingimp_walk_hd', fw: 257, fh: 300 },
    'vexmite': { f: 'vexmite_walk_hd', fw: 259, fh: 300 }, 'skarrn': { f: 'skarrn_walk_hd', fw: 220, fh: 300 },
    'grushak': { f: 'grushak_walk_hd', fw: 212, fh: 300 }, 'cindertusk': { f: 'cindertusk_walk_hd', fw: 300, fh: 253 },
    'shellwark': { f: 'shellwark_walk_hd', fw: 300, fh: 250 }, 'brukk': { f: 'brukkblackkiln_walk_2k', fw: 717, fh: 900, px: 220 },
  };
  const HM = { swarmer: 1.7, runner: 1.5, caster: 1.8, brute: 2.6, wall: 2.2, elite: 3.4, boss: 6.5 };
  const SPR = {};
  // each sheet keeps the detail it is DRAWN at on this screen (1.25x headroom), never more than the source: the largest
  // size a skin can appear at (elite / big elite / boss) x this screen's pixels per metre. Phil 24 Oct: "the detail on the
  // monsters ... is low" - a fixed 110 px cache was being drawn bigger than itself.
  const MAXM = { 'grushak': 3.4 * 1.35, 'cindertusk': 3.4 * 1.35, 'brukk': 6.5 };
  Object.keys(SKIN).forEach(k => { const d = SKIN[k], im = new Image(); im.onload = () => {
    const want = Math.ceil((MAXM[k] || 2.6) * Math.min(innerWidth * devicePixelRatio / C.VIEW.w, innerHeight * devicePixelRatio / C.VIEW.h) * 1.25);
    const sc2 = Math.min(1, Math.max(64, want) / d.fh), c = document.createElement('canvas'); c.width = Math.round(d.fw * 6 * sc2); c.height = Math.round(d.fh * 2 * sc2);
    const cx2 = c.getContext('2d'); cx2.imageSmoothingQuality = 'high'; cx2.drawImage(im, 0, 0, c.width, c.height); SPR[k] = { c, fw: c.width / 6, fh: c.height / 2 }; im.src = ''; };
    im.src = '/assets/anim/mon/' + d.f + '.webp?v=1'; });
  /* THE GROUND: one seamless tile repeated forever (Phil 24 Oct: "a very basic green grassy area, seamless so that you can loop
     it"). The tile is ChatGPT's (tasking in the Hero Survivors art folder); until it lands, a flat grass green stands in. */
  const TILE_M = 8;                                          // one tile = 8 x 8 m of ground
  let groundPat = null; { const gi = new Image(); gi.onload = () => { groundPat = gi; }; gi.src = '/assets/survivors/maps/stage1-grass.webp?v=1'; }
  const HERO_M = 4.2;   // the hero's 3D model height in world metres: bigger than life and than the fodder, so the hero reads first
  const COL = { swarmer: '#7a8a4a', runner: '#a0703a', brute: '#6a4a8a', elite: '#c23a3a', boss: '#ff2a6a', wall: '#3a7a5a' };
  function draw() {
    const W = cv.width, H = cv.height, sc = Math.min(W / C.VIEW.w, H / C.VIEW.h), h = S.hero;   // px per metre: the core's fixed view
    const X = x => W / 2 + (x - h.x) * sc, Y = y => H / 2 + (y - h.y) * sc;
    // first tile column/row at or left of / above the screen edge, so the tiles cover the whole screen
    const tp = TILE_M * sc, md = (v, m) => ((v % m) + m) % m, gx0 = md(W / 2 - h.x * sc, tp) - tp, gy0 = md(H / 2 - h.y * sc, tp) - tp;
    if (groundPat) { for (let x = gx0; x < W; x += tp) for (let y = gy0; y < H; y += tp) g.drawImage(groundPat, x, y, tp + 1, tp + 1); }   // the same tile, edge to edge
    else { g.fillStyle = '#3d6a2e'; g.fillRect(0, 0, W, H); }
    S.zones.forEach(z => { if (z.delay > 0) return; g.globalAlpha = 0.35; g.fillStyle = z.kind === 'puddle' ? '#ff6a2a' : '#ffd27a';
      const r = z.kind === 'ring' ? z.r0 + (z.r1 - z.r0) * Math.min(1, z.t / z.life) : (z.r || z.r1); g.beginPath(); g.arc(X(z.x), Y(z.y), r * sc, 0, 7); z.kind === 'ring' ? (g.strokeStyle = '#ffd27a', g.lineWidth = 4, g.stroke()) : g.fill(); g.globalAlpha = 1; });
    S.gems.forEach(m => { if (m.heal) { g.fillStyle = '#ff5a6a'; g.beginPath(); g.arc(X(m.x), Y(m.y), 0.45 * sc, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); return; }
      g.fillStyle = m.v > 3 ? '#ff6a9a' : '#5fb8ff'; g.fillRect(X(m.x) - 3, Y(m.y) - 3, 6, 6); });
    // monsters: their own walk sheets, feet on the body's spot, drawn back to front; facing = the way they move
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    const tnow = performance.now() / 1000, ord = S.monsters.slice().sort((a, b) => a.y - b.y);
    ord.forEach(m => { const sp = SPR[m.skin];
      if (!sp) { g.fillStyle = COL[m.type] || '#888'; g.beginPath(); g.arc(X(m.x), Y(m.y), m.r * sc, 0, 7); g.fill(); return; }
      const fr = Math.floor(tnow * 10 + m.id * 0.37) % 12, hpx = HM[m.type] * sc * (m.r / C.MONSTERS[m.type].r), wpx = hpx * sp.fw / sp.fh;
      const left = m.vx != null ? m.vx < 0 : h.x < m.x, x = X(m.x), y = Y(m.y) + m.r * sc * 0.6;
      g.save(); g.translate(x, y); if (left) g.scale(-1, 1);
      if (m.stunT > 0 || m.vuln > 0) g.filter = 'brightness(1.6)';
      g.drawImage(sp.c, (fr % 6) * sp.fw, Math.floor(fr / 6) * sp.fh, sp.fw, sp.fh, -wpx / 2, -hpx, wpx, hpx); g.restore();
      if (m.type === 'elite' || m.type === 'boss') { const bw = Math.max(30, hpx * 0.7); g.fillStyle = '#0008'; g.fillRect(x - bw / 2, y - hpx - 8, bw, 5); g.fillStyle = '#e2433a'; g.fillRect(x - bw / 2, y - hpx - 8, bw * Math.max(0, m.hp / m.maxHp), 5); } });
    // enemy bolts: dodge them (Phil 24 Oct)
    S.eshots.forEach(b => { const x = X(b.x), y = Y(b.y), r = Math.max(4, b.r * sc);
      g.strokeStyle = '#ff8a3a66'; g.lineWidth = r; g.beginPath(); g.moveTo(x, y); g.lineTo(x - b.vx * 0.06 * sc, y - b.vy * 0.06 * sc); g.stroke();
      g.fillStyle = '#ffd27a'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.strokeStyle = '#ff5a1a'; g.lineWidth = 2; g.stroke(); });
    S.shots.forEach(s => { g.fillStyle = s.key === '_base' ? '#fff' : '#ffb24a'; g.beginPath(); g.arc(X(s.x), Y(s.y), Math.max(3, s.r * sc), 0, 7); g.fill(); });
    // orbit auras drawn from the core's own state
    Object.keys(h.auras).forEach(k => { const a = byKey[k]; if (!a || a.fam !== 'orbit') return; const L = C.LADDER.orbit[h.auras[k] - 1], st2 = S._state[k]; if (!st2) return;
      const R = 2.0 * L.rad * sc; if (L.special) { g.strokeStyle = '#2a0a0a'; g.lineWidth = 10; g.beginPath(); g.arc(W / 2, H / 2, R, 0, 7); g.stroke(); g.strokeStyle = '#ff5a1a'; g.lineWidth = 4; g.stroke(); return; }
      for (let i = 0; i < L.n; i++) { const an = st2.a + i * Math.PI * 2 / L.n; g.fillStyle = '#ff7a2a'; g.beginPath(); g.arc(W / 2 + Math.cos(an) * R, H / 2 + Math.sin(an) * R, 0.45 * L.size * sc, 0, 7); g.fill(); } });
    // zone auras as a faint ring
    Object.keys(h.auras).forEach(k => { const a = byKey[k]; if (!a || a.fam !== 'zone') return; const L = C.LADDER.zone[h.auras[k] - 1]; g.strokeStyle = '#ffd27a55'; g.lineWidth = 3; g.beginPath(); g.arc(W / 2, H / 2, L.rad * sc, 0, 7); g.stroke(); });
    if (!H3) { g.fillStyle = h.iframes > 0 ? '#fff' : '#f2c14e'; g.beginPath(); g.arc(W / 2, H / 2, 0.5 * sc, 0, 7); g.fill(); }
    else {
      const moving = Math.abs(h.mvx) + Math.abs(h.mvy) > 0.01;
      if (!H3.isCasting()) { H3.play('Walking'); H3.clips.Walking.timeScale = moving ? 1 : 0; }
      H3.model.rotation.y = Math.atan2(h.dirx, h.diry);
      // the 3D camera sees exactly the 2D world's metres: visible height H/sc m at the hero, along the same tilt
      const vis = (H / sc), D = vis / (2 * Math.tan(15 * Math.PI / 180)); H3.cam.position.set(0, D * 0.64, D * 0.77);   /* ~40 deg down: shows her body, not the top of her head */ H3.cam.lookAt(0, 0.6, 0);
      window._dbg = { dirx: h.dirx, diry: h.diry, roty: H3.model.rotation.y, paused: !!S.choice };   // dev probe
      H3.mixer.update(Math.min(0.05, H3.clock.getDelta())); H3.r.render(H3.scene, H3.cam);
    }
    g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(W / 2, H / 2); g.lineTo(W / 2 + h.dirx * sc, H / 2 + h.diry * sc); g.stroke();
    S.fx.forEach(f => { if (f.kind !== 'ult') return; g.globalAlpha = 1 - f.t / f.life; g.fillStyle = '#ff7a2a'; g.beginPath(); const a0 = Math.atan2(f.dy, f.dx); g.moveTo(W / 2, H / 2); g.arc(W / 2, H / 2, 7 * sc, a0 - Math.PI / 3, a0 + Math.PI / 3); g.fill(); g.globalAlpha = 1; });
    document.getElementById('time').textContent = fmt(S.t);
    document.querySelector('#hp i').style.width = (100 * h.hp / h.maxHp) + '%';
    document.querySelector('#xp i').style.width = (100 * h.xp / h.xpNext) + '%';
    document.getElementById('lvl').textContent = 'Lv ' + h.level; document.getElementById('kills').textContent = S.kills;
    document.getElementById('ult').classList.toggle('ready', h.ult >= h.ultMax);
    h.kit.forEach((k, i) => { const b = document.getElementById('sk' + i); if (!b) return; const f = k.cdLeft / (k.cd || 1);
      b.style.setProperty('--cd', f.toFixed(3)); b.classList.toggle('cool', k.cdLeft > 0); b.querySelector('small').textContent = k.cdLeft > 0 ? Math.ceil(k.cdLeft) : ''; });
    // skill + ult feedback: placeholder rings until the spell art is wired; the 3D model plays the cast clip
    S.fx.forEach(f => { if (f.seq && f.seq > seenFx) { seenFx = f.seq; if (H3) H3.cast(f.kind === 'ult' ? 'mage_soell_cast_2' : (KIT[f.slot] || {}).anim); }
      if (f.kind !== 'cast') return; g.globalAlpha = 1 - f.t / f.life; g.strokeStyle = (KIT[f.slot] || {}).kind === 'heal' ? '#7dffa0' : '#ffd27a'; g.lineWidth = 6;
      g.beginPath(); g.arc(W / 2, H / 2, (1 + 3 * f.t / f.life) * sc, 0, 7); g.stroke(); g.globalAlpha = 1; });
    if (h.wardT > 0) { g.strokeStyle = '#f2c14e'; g.lineWidth = 3; g.setLineDash([6, 6]); g.beginPath(); g.arc(W / 2, H / 2, 1.1 * sc, 0, 7); g.stroke(); g.setLineDash([]); }
  }
})();
</script>
