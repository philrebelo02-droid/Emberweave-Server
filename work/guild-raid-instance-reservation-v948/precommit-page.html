<!doctype html><meta charset="utf-8"><title>Private Guild precommit tab-close check</title>
<style>body{font:16px system-ui;background:#111827;color:#eee;padding:24px}button{padding:12px;margin:6px}pre{white-space:pre-wrap}</style>
<h1>Private Guild precommit tab-close check</h1><p>Exact client 28ec2c6d. Synthetic isolated storage only. No live gameplay or release approval.</p>
<button id="begin">Begin held reservation</button><button id="verify">Verify after tab closure</button><pre id="out">Ready.</pre>
<script src="/modules.js"></script><script>
const out=document.querySelector('#out'),M=EW_RAID_V3_MODULES;
const row={v:3,accountId:'precommit-0601',guildId:'fixture',id:'slot',entry:{requestId:'r3:2026-10-03:precommit0601',heroIds:['hero1']},state:'pending'};
async function open(){return new Promise((resolve,reject)=>{const q=indexedDB.open('codex-private-precommit-0601',1);q.onupgradeneeded=()=>{const s=q.result.createObjectStore('slots',{keyPath:['accountId','id']});s.createIndex('account','accountId')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function record(kind,detail){await fetch('/record',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind,at:new Date().toISOString(),userAgent:navigator.userAgent,detail})})}
document.querySelector('#begin').onclick=async()=>{document.querySelector('#begin').disabled=true;const db=await open();let active=true,success=false,complete=false;const wrapped={transaction(name,mode){const t=db.transaction(name,mode),real=t.objectStore.bind(t);t.addEventListener('complete',()=>{complete=true;active=false;record('unexpected-complete',{success,complete})});t.addEventListener('abort',()=>{active=false;record('abort',{success,complete})});t.objectStore=n=>{const s=real(n),add=s.add.bind(s);s.add=p=>{const q=add(p);q.addEventListener('success',()=>{success=true;function hold(){if(!active)return;const g=s.get([row.accountId,row.id]);g.onsuccess=hold}hold();out.textContent='Add request succeeded; transaction held with queued native reads. Close ONLY this fixture tab now.';record('request-success-held',{success,complete,explicitAbort:false})});return q};return s};return t}};M.directory.create(wrapped).insertBounded(row,4).then(()=>{out.textContent='Unexpected transaction commit';record('insert-resolved',{success,complete})},e=>record('insert-rejected',{success,complete,error:e.message}));};
document.querySelector('#verify').onclick=async()=>{document.querySelector('#verify').disabled=true;const db=await open(),D=M.directory.create(db);const before=await D.list(row.accountId,5),events=await(await fetch('/evidence')).json();const held=events.some(e=>e.kind==='request-success-held'&&e.detail.success&&!e.detail.complete),premature=events.some(e=>['unexpected-complete','insert-resolved'].includes(e.kind));let result={heldObserved:held,prematureComplete:premature,rowsAfterClose:before.length,scope:'Actual tab closure while synthetic read queue keeps native transaction active; not renderer crash, full Guild flow, quota or real quiescence.'};if(held&&!premature&&before.length===0){await D.insertBounded(row,4);result.retryRows=(await D.list(row.accountId,5)).length;result.status=result.retryRows===1?'PASS':'FAIL'}else result.status='FAIL';out.textContent=JSON.stringify(result,null,2);await record('verified-after-close',result);db.close()};
</script>
