<!doctype html><meta charset="utf-8"><title>Private Guild recovery native checks</title>
<style>body{font:16px system-ui;background:#111827;color:#eee;padding:24px}button{margin:6px;padding:12px;font-size:16px}pre{white-space:pre-wrap;max-width:1050px}h1{font-size:24px}</style>
<h1>Private Guild recovery — native storage checks</h1>
<p>Exact client 28ec2c6d. Isolated localhost fixture only. No live accounts or gameplay. Not activation or balance approval.</p>
<button id="run">Run native storage checks</button><button id="hold">Hold account lock</button><button id="release">Release account lock</button><button id="discover">Try locked discovery</button><button id="read">Read persisted evidence</button>
<pre id="output">Ready. No checks run.</pre><script src="/modules.js"></script><script>
const M=EW_RAID_V3_MODULES,copy=x=>JSON.parse(JSON.stringify(x)),output=document.querySelector('#output'),cases=[];
let db,releaseLock,lockHeld=false;
function assert(ok,msg){if(!ok)throw Error(msg)}
async function open(){if(db)return db;db=await new Promise((resolve,reject)=>{const q=indexedDB.open('codex-private-raid-28ec-native-20261003',1);q.onupgradeneeded=()=>{const s=q.result.createObjectStore('slots',{keyPath:['accountId','id']});s.createIndex('account','accountId')};q.onerror=()=>reject(q.error);q.onsuccess=()=>resolve(q.result)});return db}
function row(account,id='slot',request='one'){return {v:3,accountId:account,guildId:'native-guild',id,entry:{requestId:'r3:2026-10-03:'+request,heroIds:['hero1']},state:'pending'}}
async function record(name,fn){try{const detail=await fn();cases.push({name,status:'PASS',detail})}catch(e){cases.push({name,status:'FAIL',error:e.message})}output.textContent=JSON.stringify(cases,null,2)}
async function persist(kind,detail){await fetch('/record',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind,at:new Date().toISOString(),userAgent:navigator.userAgent,cases,detail})})}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const native=await open(),D=M.directory.create(native),nonce=crypto.randomUUID().slice(0,8);
 await record('Native IndexedDB two connections same id/entry commit exactly once',async()=>{const second=await new Promise((resolve,reject)=>{const q=indexedDB.open(native.name,1);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});try{const r=row('same-'+nonce),s=await Promise.allSettled([D.insertBounded(r,4),M.directory.create(second).insertBounded(r,4)]);assert(s.filter(x=>x.status==='fulfilled').length===1,'Not exactly one commit');const found=await D.list(r.accountId,5);assert(found.length===1,'Wrong durable count');return s.map(x=>({status:x.status,error:x.reason?.message}))}finally{second.close()}});
 await record('Native different ids cannot duplicate entry identity',async()=>{const r=row('entry-'+nonce),s=await Promise.allSettled([D.insertBounded(r,4),D.insertBounded({...copy(r),id:'other'},4)]);assert(s.filter(x=>x.status==='fulfilled').length===1,'Duplicate entry committed');assert((await D.list(r.accountId,5)).length===1,'Wrong durable count');return s.map(x=>x.status)});
 await record('Native queued reservations cannot exceed cap4',async()=>{const account='cap-'+nonce;for(let i=0;i<3;i++)await D.insertBounded(row(account,'prior'+i,'prior'+i),4);const s=await Promise.allSettled([D.insertBounded(row(account,'a','a'),4),D.insertBounded(row(account,'b','b'),4)]);assert(s.filter(x=>x.status==='fulfilled').length===1,'Cap race');assert((await D.list(account,5)).length===4,'Wrong cap');return s.map(x=>x.status)});
 await record('Native add success followed by explicit commit abort rejects and leaves no row',async()=>{const r=row('abort-'+nonce);let sawRequestSuccess=false;const wrapped={transaction(name,mode){const t=native.transaction(name,mode),real=t.objectStore.bind(t);t.objectStore=n=>{const store=real(n),add=store.add.bind(store);store.add=p=>{const q=add(p);q.addEventListener('success',()=>{sawRequestSuccess=true;t.abort()});return q};return store};return t}};let refused=false;try{await M.directory.create(wrapped).insertBounded(r,4)}catch{refused=true}assert(sawRequestSuccess&&refused,'Missing request-success abort');assert((await D.list(r.accountId,5)).length===0,'Aborted row survived');await D.insertBounded(r,4);assert((await D.list(r.accountId,5)).length===1,'Fresh retry failed');return {sawRequestSuccess,refused,retryCommitted:true}});
 await record('Native confirmed cleanup retains marker; occupied instance refuses before enrollment',async()=>{const account='marker-'+nonce,scope={accountId:account,guildId:'native-guild'},H=M.hybrid.create(D,localStorage,{isCurrent:()=>true,legacyCheck:async()=> 'clear'}),E={requestId:'r3:2026-10-03:marker',heroIds:['hero1']},lease=await H.enroll(scope,E,'slot'),P={requestId:'result',attemptId:'attempt',inputLog:[],dmg:12};H.stage(lease,P);await H.confirm(scope,'slot',P);await H.cleanup(scope,'slot');const key=M.hybrid.key(lease),raw=localStorage.getItem(key);assert(JSON.parse(raw).confirmed===true,'No terminal fence');assert((await D.list(account,5)).length===0,'Directory not retired');let refused=false;try{await M.hybrid.create(D,localStorage,{isCurrent:()=>true,legacyCheck:async()=> 'clear'}).enroll(scope,{...E,requestId:'r3:2026-10-03:new'},'slot')}catch{refused=true}assert(refused,'Occupied id enrolled');assert((await D.list(account,5)).length===0,'Blocked enrollment inserted');assert(localStorage.getItem(key)===raw,'Marker changed');return {refused,retainedBytes:raw.length}});
 await record('Native absent legacy proof blocks actual facade before transport',async()=>{let transports=0;const context=()=>({accountId:'missing-'+nonce,guildId:'native-guild',token:'fixture-token',epoch:1}),F=M.facade.create({directory:D,storage:localStorage,context,locks:navigator.locks,transport:async()=>{transports++},legacyWritersQuiescent:async()=>false});let refused=false;try{await F.discover()}catch(e){refused=e.message==='Legacy writers not proven quiescent'}assert(refused&&transports===0,'Missing proof did not hold');return {refused,transports}});
 db.close();db=null;await record('Native close/reopen keeps committed fixture rows and terminal fence',async()=>{const fresh=M.directory.create(await open());assert((await fresh.list('same-'+nonce,5)).length===1,'Committed row missing');assert((await fresh.list('cap-'+nonce,5)).length===4,'Cap rows missing');const marker=localStorage.getItem('codex_private_raid_slot_v3_'+encodeURIComponent('marker-'+nonce)+'_slot');assert(JSON.parse(marker).confirmed===true,'Fence missing');return {reopened:true}});
 await persist('storage-suite',{nonce,pass:cases.filter(x=>x.status==='PASS').length,fail:cases.filter(x=>x.status==='FAIL').length,limits:'Actual Chrome IDB/localStorage/WebLocks, actual embedded components. No game UI/HTTP/auth/balance, quota or precommit tab close; no old-writer quiescence provider.'});output.textContent=JSON.stringify({pass:cases.filter(x=>x.status==='PASS').length,fail:cases.filter(x=>x.status==='FAIL').length,cases},null,2)};
document.querySelector('#hold').onclick=()=>{navigator.locks.request('ew_raid_pending_v1_native-lock-28ec',{mode:'exclusive'},async()=>{lockHeld=true;output.textContent='Account lock held. Open the second fixture tab and try locked discovery.';await persist('lock-held',{lockHeld:true});await new Promise(resolve=>releaseLock=resolve);lockHeld=false;output.textContent='Account lock released.';await persist('lock-released',{lockHeld:false})}).catch(e=>output.textContent=e.message)};
document.querySelector('#release').onclick=()=>{if(releaseLock){releaseLock();releaseLock=null}else output.textContent='No held lock in this tab.'};
document.querySelector('#discover').onclick=async()=>{const context=()=>({accountId:'native-lock-28ec',guildId:'native-guild',token:'fixture-token',epoch:1});let legacyCalls=0,directoryCalls=0,transports=0;const F=M.facade.create({context,locks:navigator.locks,storage:localStorage,directory:{list:async()=>{directoryCalls++;return []}},legacyWritersQuiescent:async()=>{legacyCalls++;return true},transport:async()=>{transports++}});try{const choices=await F.discover();output.textContent=JSON.stringify({status:'available',choices,legacyCalls,directoryCalls,transports});await persist('lock-discovery',{status:'available',choices,legacyCalls,directoryCalls,transports})}catch(e){output.textContent=JSON.stringify({status:'refused',error:e.message,legacyCalls,directoryCalls,transports});await persist('lock-discovery',{status:'refused',error:e.message,legacyCalls,directoryCalls,transports})}};
document.querySelector('#read').onclick=async()=>output.textContent=JSON.stringify(await(await fetch('/evidence')).json(),null,2);
</script>
